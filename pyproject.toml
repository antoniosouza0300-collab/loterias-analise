[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loterias-analise"
version = "7.0.0"
description = "Dashboard Lotofácil + Dia de Sorte + Mega-Sena: análise, geração e validação de jogos"
requires-python = ">=3.11"
dependencies = [
    "gradio>=5.0,<6.0",
    "pandas>=2.0,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"
